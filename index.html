<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baha Dobay</title>
  <meta name="description" content="Baha Dobay — projects, notes and writing.">
  <style>
    :root {
      --bg: #fbfaf8;
      --text: #1d1d1f;
      --muted: #6b6b70;
      --accent: #2f5bd3;
      --rule: #e4e2dd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141416;
        --text: #ececee;
        --muted: #9a9aa2;
        --accent: #8ba7ff;
        --rule: #2a2a2e;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 18vh 1.25rem 4rem;
    }
    h1 {
      font-size: 2rem;
      letter-spacing: -0.02em;
      margin: 0 0 0.25rem;
    }
    p { margin: 0 0 1.5rem; color: var(--muted); }
    nav {
      display: flex;
      gap: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--rule);
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Baha Dobay</h1>
    <p>Projects, notes and writing.</p>
    <nav>
      <a href="https://github.com/bahadobay">GitHub</a>
    </nav>
  </main>
</body>
</html>
